name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Secrets necessários no repo GitHub (apenas 2 — account_id está no wrangler.toml):
#   CLOUDFLARE_API_TOKEN   — OAuth token ou API token do wrangler
#   DATABASE_URL           — connection string Neon (branch main)
#
# account_id = f4000b2968b2834704aef648152c7dd4  (hardcoded nos wrangler.toml)
# ---------------------------------------------------------------------------

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Deploy Cloudflare Pages (apps/web)
  # -------------------------------------------------------------------------
  deploy-pages:
    name: Deploy → Cloudflare Pages (apps/web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (dependências de apps/web)
        run: pnpm turbo run build --filter=@imovi/web^...

      - name: Build apps/web para Cloudflare Pages
        working-directory: apps/web
        run: pnpm build:cf
        env:
          # vercel build precisa de VERCEL_ORG_ID e VERCEL_PROJECT_ID apenas
          # se o projeto estiver linkado. Com --yes ele cria/detecta automaticamente.
          VERCEL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy para Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "f4000b2968b2834704aef648152c7dd4"
          workingDirectory: apps/web
          command: pages deploy .vercel/output/static --project-name=imovi-web --branch=main --account-id=f4000b2968b2834704aef648152c7dd4

  # -------------------------------------------------------------------------
  # Job 2: Deploy Cloudflare Worker (apps/worker)
  # -------------------------------------------------------------------------
  deploy-worker:
    name: Deploy → Cloudflare Worker (apps/worker)
    runs-on: ubuntu-latest
    needs: []   # independente do Pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (dependências de apps/worker)
        run: pnpm turbo run build --filter=@imovi/worker^...

      - name: Build apps/worker
        run: pnpm turbo run build --filter=@imovi/worker

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "f4000b2968b2834704aef648152c7dd4"
          workingDirectory: apps/worker
          command: deploy
        # DATABASE_URL é secret no Worker — provisionado via
        # `wrangler secret put DATABASE_URL` (não transita pelo CI)
