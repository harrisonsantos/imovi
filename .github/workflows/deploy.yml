name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Secrets necessários no repo GitHub (apenas 2 — account_id está no wrangler.toml):
#   CLOUDFLARE_API_TOKEN   — OAuth token ou API token do wrangler
#   DATABASE_URL           — connection string Neon (branch main)
#
# account_id = f4000b2968b2834704aef648152c7dd4  (hardcoded nos wrangler.toml)
# ---------------------------------------------------------------------------

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Deploy Cloudflare Pages (apps/web)
  # -------------------------------------------------------------------------
  deploy-pages:
    name: Deploy → Cloudflare Pages (apps/web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (dependências de apps/web)
        run: pnpm turbo run build --filter=@imovi/web^...

      - name: Build apps/web para Cloudflare Pages
        working-directory: apps/web
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAC-vdQ1-_9T1AmV_"
        # `vercel build` roda offline porque apps/web/.vercel/project.json
        # está commitado com IDs placeholder. Sem token, sem scope lookup,
        # sem envio para Vercel — apenas geração local do bundle que
        # next-on-pages consome depois.
        run: pnpm build:cf

      - name: Garantir bucket R2 de matrículas
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f4000b2968b2834704aef648152c7dd4
        run: pnpm exec wrangler r2 bucket create imovi-matriculas || pnpm exec wrangler r2 bucket info imovi-matriculas

      # Wrangler direto via pnpm (já em apps/web/devDeps) — evita o bug do
      # wrangler-action que tenta `npm install` em workspaces pnpm.
      - name: Deploy para Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f4000b2968b2834704aef648152c7dd4
        run: pnpm exec wrangler pages deploy .vercel/output/static --project-name=imovi-web --branch=main

  # -------------------------------------------------------------------------
  # Job 2: Deploy Cloudflare Worker (apps/worker)
  # -------------------------------------------------------------------------
  deploy-worker:
    name: Deploy → Cloudflare Worker (apps/worker)
    runs-on: ubuntu-latest
    needs: []   # independente do Pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (dependências de apps/worker)
        run: pnpm turbo run build --filter=@imovi/worker^...

      - name: Build apps/worker
        run: pnpm turbo run build --filter=@imovi/worker

      # Chamamos wrangler direto via pnpm (wrangler está em apps/worker/devDeps).
      # Evita `cloudflare/wrangler-action@v3` que roda `npm install` interno e
      # quebra com `Unsupported URL Type "workspace:"` no monorepo pnpm.
      - name: Deploy Worker
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f4000b2968b2834704aef648152c7dd4
        run: pnpm exec wrangler deploy
        # DATABASE_URL é secret no Worker — provisionado via
        # `wrangler secret put DATABASE_URL` (não transita pelo CI)
