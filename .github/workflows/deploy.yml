name: Deploy

# Push runs CI only. An operator explicitly selects preview or production.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit SHA to validate and publish
        required: true
        type: string
      target:
        description: Target environment
        required: true
        type: choice
        default: preview
        options: [preview, production]
      confirm_production:
        description: I approve production publication after staging and backup gates
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Validate SHA and production authorization
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          TARGET: ${{ inputs.target }}
          CONFIRMED: ${{ inputs.confirm_production }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          if [ "$TARGET" = production ]; then
            test "$CONFIRMED" = true
            test "$REQUESTED_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          fi
  checks:
    needs: authorize
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ inputs.sha }}
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@imovi/web^... --filter=@imovi/worker...
      - run: pnpm --filter @imovi/web build:cf
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAC-vdQ1-_9T1AmV_'
          NEXT_PUBLIC_APP_ENV: ${{ inputs.target }}
      - name: Publish Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.target }}
        run: |
          BRANCH=preview
          if [ "$TARGET" = production ]; then BRANCH=main; fi
          pnpm exec wrangler pages deploy .vercel/output/static --project-name=imovi-web --branch="$BRANCH" --commit-hash="${{ inputs.sha }}"
      - name: Publish Worker
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = production ]; then
            pnpm exec wrangler deploy
          else
            pnpm exec wrangler deploy --env=preview
          fi
      - name: Functional smoke and readiness
        env:
          WEB_URL: ${{ vars.WEB_URL }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          test -n "$WEB_URL"
          test -n "$WORKER_URL"
          node scripts/smoke.mjs
