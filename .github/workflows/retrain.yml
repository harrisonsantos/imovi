# Retraining semanal do modelo AVM.
#
# Fluxo: export Neon → train (com quantiles) → gate de promoção (MdAPE não
# pode regredir vs. modelo ativo) → upload ONNX p/ R2 → registra + ativa em
# model_versions. Reprovação no gate falha o job de propósito (visibilidade).
#
# Secrets necessários: DATABASE_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: retrain-model

on:
  schedule:
    - cron: '0 8 * * 1' # segunda 05:00 BRT — depois do scrape diário das 03:00
  workflow_dispatch: {}

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-training
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Instala dependências
        run: uv sync --frozen

      - name: Define versão do modelo
        id: version
        run: echo "version=v-auto-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Exporta dataset do Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m imovi_training.cli export-neon --output data/train.parquet

      - name: Treina modelo (com quantiles p10/p90)
        run: |
          # Cutoff = 14 dias atrás → holdout temporal com os dados mais recentes
          CUTOFF=$(date -d '14 days ago' +%Y-%m-%d)
          uv run python -m imovi_training.cli train \
            --input data/train.parquet \
            --output models/model.onnx \
            --metrics models/metrics.json \
            --cutoff "$CUTOFF" \
            --model-version "${{ steps.version.outputs.version }}" \
            --quantiles

      - name: Gate de promoção (dry-run)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m imovi_training.promote \
            --metrics models/metrics.json \
            --version "${{ steps.version.outputs.version }}" \
            --artifact-url "r2://imovi-model-artifacts/current/model.onnx" \
            --dry-run

      - name: Upload artefatos para R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .
        run: |
          npx wrangler r2 object put imovi-model-artifacts/current/model.onnx \
            --file ml-training/models/model.onnx --remote
          npx wrangler r2 object put imovi-model-artifacts/current/model.onnx.metadata.json \
            --file ml-training/models/model.onnx.metadata.json --remote
          npx wrangler r2 object put imovi-model-artifacts/current/model-p10.onnx \
            --file ml-training/models/model-p10.onnx --remote
          npx wrangler r2 object put imovi-model-artifacts/current/model-p90.onnx \
            --file ml-training/models/model-p90.onnx --remote

      - name: Registra e ativa em model_versions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m imovi_training.promote \
            --metrics models/metrics.json \
            --version "${{ steps.version.outputs.version }}" \
            --artifact-url "r2://imovi-model-artifacts/current/model.onnx"

      - name: Publica métricas no summary
        if: always()
        run: |
          echo '## Métricas do retraining' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat models/metrics.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo '(sem métricas)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
