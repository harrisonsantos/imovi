name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TS lint typecheck test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  ml-training:
    name: Python ml-training pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if ml-training exists
        id: check
        run: |
          if [ -f ml-training/pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: '3.13'

      - name: Install uv
        if: steps.check.outputs.exists == 'true'
        run: pip install uv

      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: ml-training
        run: uv sync

      - name: Run pytest
        if: steps.check.outputs.exists == 'true'
        working-directory: ml-training
        run: uv run pytest
