name            = "imovi-web"
compatibility_date  = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "imovi-web"

# ---------------------------------------------------------------------------
# Vars públicas (não-sensíveis)
# ---------------------------------------------------------------------------
[vars]
NEXT_PUBLIC_APP_ENV = "production"
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAC-vdQ1-_9T1AmV_"

# IPTU_CACHE pertence ao Worker de jobs; não há consumidor no web.

# ---------------------------------------------------------------------------
# R2 — artefatos do modelo AVM (.onnx + sidecar metadata.json)
# Bucket criado: imovi-model-artifacts. Sem modelo subido ainda — route
# /api/estimate cai no fallback heurístico até primeiro upload.
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding     = "MODEL_ARTIFACTS"
bucket_name = "imovi-model-artifacts"

# ---------------------------------------------------------------------------
# R2 — documentos de matrícula enviados pelo dashboard de auditoria
# (POST /api/auditoria/matricula/upload). Crie o bucket com
# `wrangler r2 bucket create imovi-matriculas` antes do primeiro deploy.
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding     = "MATRICULAS"
bucket_name = "imovi-matriculas"

# ---------------------------------------------------------------------------
# Ambientes
# ---------------------------------------------------------------------------
[env.preview]
name = "imovi-web-preview"

[[env.preview.services]]
binding = "WORKER_SELF_REFERENCE"
service = "imovi-web-preview"

[env.preview.vars]
NEXT_PUBLIC_APP_ENV = "preview"
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAC-vdQ1-_9T1AmV_"

[[env.preview.r2_buckets]]
binding = "MODEL_ARTIFACTS"
bucket_name = "imovi-model-artifacts-preview"

[[env.preview.r2_buckets]]
binding = "MATRICULAS"
bucket_name = "imovi-matriculas-preview"
