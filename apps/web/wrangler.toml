name            = "imovi-web"
compatibility_date  = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"
# account_id não é suportado em projetos Pages — passe via --account-id na CLI
# ou configure CLOUDFLARE_ACCOUNT_ID no ambiente

# ---------------------------------------------------------------------------
# Vars públicas (não-sensíveis)
# ---------------------------------------------------------------------------
[vars]
NEXT_PUBLIC_APP_ENV = "production"
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAC-vdQ1-_9T1AmV_"

# ---------------------------------------------------------------------------
# KV binding — mesmo namespace do worker para cache compartilhado
# Substitua os IDs após `wrangler kv namespace create IPTU_CACHE`
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding    = "IPTU_CACHE"
id         = "b384e5763b564f67a33408eabc578fc5"
preview_id = "cc01efc63dc34def97783f42ddf30282"

# ---------------------------------------------------------------------------
# R2 — artefatos do modelo AVM (.onnx + sidecar metadata.json)
# Bucket criado: imovi-model-artifacts. Sem modelo subido ainda — route
# /api/estimate cai no fallback heurístico até primeiro upload.
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding     = "MODEL_ARTIFACTS"
bucket_name = "imovi-model-artifacts"

# ---------------------------------------------------------------------------
# R2 — documentos de matrícula enviados pelo dashboard de auditoria
# (POST /api/auditoria/matricula/upload). Crie o bucket com
# `wrangler r2 bucket create imovi-matriculas` antes do primeiro deploy.
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding     = "MATRICULAS"
bucket_name = "imovi-matriculas"

# ---------------------------------------------------------------------------
# Ambientes
# ---------------------------------------------------------------------------
[env.preview]
name = "imovi-web"   # Pages usa o mesmo projeto, branch = preview

[env.preview.vars]
NEXT_PUBLIC_APP_ENV = "preview"

[[env.preview.kv_namespaces]]
binding = "IPTU_CACHE"
id = "cc01efc63dc34def97783f42ddf30282"

[[env.preview.r2_buckets]]
binding = "MODEL_ARTIFACTS"
bucket_name = "imovi-model-artifacts-preview"

[[env.preview.r2_buckets]]
binding = "MATRICULAS"
bucket_name = "imovi-matriculas-preview"
