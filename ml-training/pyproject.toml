[project]
name = "imovi-training"
version = "0.0.0"
description = "Treinamento do modelo AVM — imovi"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "skl2onnx>=1.17",
  "onnxmltools>=1.12",
  "onnxruntime>=1.20",
  "onnxconverter-common>=1.16.0",
  "psycopg[binary]>=3.2",
  "pyarrow>=17.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imovi_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
